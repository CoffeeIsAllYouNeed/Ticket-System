<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AutoRoute AI - Role Login</title>
    <style>
        body { background: #0b0f19; color: #f1f5f9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #151c2e; padding: 32px; border-radius: 12px; width: 340px; border: 1px solid #2e3a59; }
        h2 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
        label { display: block; margin-top: 12px; font-size: 0.85rem; color: #94a3b8; }
        input { width: 100%; padding: 10px; margin-top: 6px; background: #0b0f19; border: 1px solid #2e3a59; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; background: linear-gradient(135deg, #38bdf8, #818cf8); border: none; font-weight: bold; color: #fff; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>System Role Login</h2>
        <form method="POST">
            <label>Role Account Username</label>
            <input type="text" name="username" placeholder="admin, hr, billing, technical, general" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
