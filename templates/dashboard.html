<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ role }} Support Desk</title>
    <style>
        body { background: #0b0f19; color: #f1f5f9; font-family: sans-serif; padding: 32px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .ticket { background: #151c2e; border: 1px solid #2e3a59; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .meta { color: #94a3b8; font-size: 0.85rem; margin-bottom: 12px; }
        .logout { color: #ef4444; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ role }} Support Queue</h1>
        <a href="/logout" class="logout">Logout</a>
    </div>

    {% for t in tickets %}
    <div class="ticket">
        <h3>{{ t[2] }}</h3>
        <div class="meta">From: {{ t[1] }} | Model Confidence: {{ "%.1f"|format(t[4] * 100) }}% | Received: {{ t[5] }}</div>
        <p>{{ t[3] }}</p>
    </div>
    {% else %}
    <p style="color: #94a3b8;">No active tickets in the {{ role }} queue.</p>
    {% endfor %}
</body>
</html>
