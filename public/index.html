<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granola.ai</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <svg class="brand-logo" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <path d="M7 8.5c1.5-1 3.5 1 5 0s3.5-1 5 0"></path>
                <path d="M7 12c1.5-1 3.5 1 5 0s3.5-1 5 0"></path>
                <path d="M7 15.5c1.5-1 3.5 1 5 0s3.5-1 5 0"></path>
            </svg>
            <span class="brand-title">Granola.ai</span>
        </div>
        
        <nav class="main-nav">
            <div class="dropdown" id="profileDropdown">
                <button class="nav-link dropdown-toggle" id="profileDropdownBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile
                    <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <div class="dropdown-menu">
                    <button class="dropdown-item" onclick="selectRole('Admin')">Admin Oversight</button>
                    <button class="dropdown-item" onclick="selectRole('HR')">HR Department</button>
                    <button class="dropdown-item" onclick="selectRole('Billing')">Billing Department</button>
                    <button class="dropdown-item" onclick="selectRole('Technical')">Technical Department</button>
                </div>
            </div>
            
            <button class="nav-link active" id="customerSupportBtn" onclick="selectRole('Customer')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Customer Support
            </button>
        </nav>

        <div class="header-user-actions" id="headerUserActions">
            <div class="notification-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="badge-dot"></span>
            </div>
            <div class="avatar">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="User Avatar">
            </div>
        </div>

        <select id="profileSelect" onchange="switchRole()" style="display: none;">
            <option value="Customer" selected>Customer</option>
            <option value="Admin">Admin</option>
            <option value="Technical">Technical</option>
            <option value="Billing">Billing</option>
            <option value="HR">HR</option>
        </select>
    </header>

    <main class="container">
        <!-- Customer Complaint View -->
        <section id="customerView" class="dashboard-section active">
            <div class="form-wrapper">
                <div class="card form-card">
                    <div class="card-header-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4m0 4h.01"></path></svg>
                    </div>
                    <h2>Submit a Complaint</h2>
                    <p class="subtitle">We usually respond within 24 hours.</p>
                    
                    <form id="ticketForm" onsubmit="handleTicketSubmit(event)">
                        <div class="form-group">
                            <label for="senderEmail">Email</label>
                            <input type="email" id="senderEmail" placeholder="Enter your email address" required>
                        </div>
                        <div class="form-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Enter subject" required>
                        </div>
                        <div class="form-group">
                            <label for="body">Message</label>
                            <textarea id="body" rows="4" placeholder="Describe your issue here" required></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="btn primary-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            <span>Submit</span>
                        </button>
                    </form>
                    <div id="submitStatus" class="status-banner"></div>
                </div>
            </div>
        </section>

        <!-- Complaints Dashboard View (Admin / Department) -->
        <section id="dashboardView" class="dashboard-section">
            <div class="dashboard-top">
                <div class="title-group">
                    <h2 id="viewHeading">Received Complaints</h2>
                    <p class="subtitle" id="viewSubheading">Viewing as: Admin</p>
                </div>
                <div class="action-group">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" placeholder="Search by email or subject" onkeyup="filterTickets()">
                    </div>
                    <select class="filter-select" id="priorityFilter">
                        <option value="all">All priorities</option>
                        <option value="high">High Priority</option>
                        <option value="medium">Medium Priority</option>
                    </select>
                </div>
            </div>

            <!-- Stats Overview Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">Total Complaints</span>
                        <span class="stat-value" id="statTotal">0</span>
                    </div>
                    <div class="stat-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">Open</span>
                        <span class="stat-value" id="statOpen">0</span>
                    </div>
                    <div class="stat-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">Resolved</span>
                        <span class="stat-value" id="statResolved">0</span>
                    </div>
                    <div class="stat-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">Avg. Response</span>
                        <span class="stat-value">3.4h</span>
                    </div>
                    <div class="stat-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                </div>
            </div>

            <!-- Complaints Table -->
            <div class="table-card">
                <div id="tableContainer"></div>
                <div class="table-footer">
                    <span id="footerCount">Showing 0 complaints</span>
                    <div class="pagination">
                        <button class="page-btn" disabled>&lt;</button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">&gt;</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="classifier.js"></script>
    <script src="app.js"></script>
</body>
</html>
