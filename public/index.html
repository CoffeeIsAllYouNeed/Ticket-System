<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoRoute AI - Ticket Management Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AutoRoute AI Portal</h1>
      <div class="role-selector">
        <label for="profileSelect">Select Role Profile: </label>
        <select id="profileSelect" onchange="switchRole()">
          <option value="HR">HR Department</option>
          <option value="Billing">Billing Department</option>
          <option value="Technical">Technical Support</option>
          <option value="General">General Inquiries</option>
          <option value="Admin">Admin (Full Control + Probabilities)</option>
        </select>
      </div>
    </header>

    <main id="portalContent">
      <div id="ticketsContainer" class="ticket-grid"></div>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
